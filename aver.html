<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aver Jewels — Tarnish-Free | Waterproof | Skin Safe">
  <meta name="theme-color" content="#f7f3ee">
  <title>Aver Jewels</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(145deg, #fbf8f4, #eee7df);
      color: #29231f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      font-size: clamp(42px, 12vw, 68px);
      letter-spacing: 7px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .tagline {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      line-height: 1.8;
      text-transform: uppercase;
      color: #756b63;
      margin: 0 auto 38px;
    }

    .card {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(120, 100, 80, 0.16);
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 18px 50px rgba(70, 50, 35, 0.10);
      backdrop-filter: blur(10px);
    }

    .intro {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 24px;
      color: #4b433d;
    }

    .button {
      display: block;
      width: 100%;
      padding: 17px 20px;
      margin: 12px 0;
      border-radius: 999px;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(70, 50, 35, 0.14);
    }

    .whatsapp {
      background: #29231f;
      color: #fff;
    }

    .instagram {
      background: transparent;
      color: #29231f;
      border: 1px solid #b9aea3;
    }

    .footer {
      margin-top: 24px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #8a7f76;
    }

    .sparkle {
      font-size: 18px;
      margin-bottom: 14px;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="sparkle">✦</div>

    <h1 class="brand">AVER</h1>

    <div class="tagline">
      Tarnish-Free &nbsp;|&nbsp; Waterproof &nbsp;|&nbsp; Skin Safe
    </div>

    <section class="card">

      <p class="intro">
        Timeless pieces, made for every day.
      </p>

      <!-- WhatsApp Button -->
      <a
        class="button whatsapp"
        href="https://wa.me/918347064802?text=Hi%20Aver%20Jewels%2C%20I%27d%20like%20to%20know%20more%20about%20your%20jewellery."
        target="_blank"
        rel="noopener"
      >
        ✦ &nbsp; SHOP ON WHATSAPP
      </a>

      <!-- Instagram Button -->
      <a
        class="button instagram"
        href="https://www.instagram.com/aver.jewels/"
        target="_blank"
        rel="noopener"
      >
        FOLLOW @AVER.JEWELS
      </a>

    </section>

    <div class="footer">
      AVER JEWELS · EVERYDAY ELEGANCE
    </div>

  </main>

</body>
</html>
