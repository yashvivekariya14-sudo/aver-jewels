<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Aver Jewels — Tarnish-Free | Waterproof | Skin Safe">
  <meta name="theme-color" content="#38050e">
  <title>Aver Jewels</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; min-height: 100%; }

    body {
      min-height: 100svh;
      font-family: Arial, sans-serif;
      background: #38050e;
      color: #f7eee8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
    }

    .page {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      display: block;
      width: 58%;
      max-width: 245px;
      min-width: 170px;
      height: auto;
      margin: 0 auto 8px;
    }

    .tagline {
      font-size: clamp(9px, 2.5vw, 11px);
      letter-spacing: 1.7px;
      line-height: 1.7;
      text-transform: uppercase;
      color: #d8bdb9;
      margin: 0 auto 28px;
      white-space: nowrap;
    }

    .card {
      width: 100%;
      background: rgba(255, 248, 242, .075);
      border: 1px solid rgba(245, 224, 213, .18);
      border-radius: 24px;
      padding: 24px 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .25);
      backdrop-filter: blur(14px);
    }

    .intro {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #f1ded8;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 999px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      -webkit-tap-highlight-color: transparent;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .button:active {
      transform: scale(.98);
    }

    .whatsapp {
      background: #f7eee8;
      color: #38050e;
    }

    .instagram {
      background: transparent;
      color: #f7eee8;
      border: 1px solid rgba(245, 224, 213, .38);
    }

    .footer {
      margin-top: 20px;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: #bfa3a0;
    }

    @media (max-width: 360px) {
      body { padding: 16px 12px; }
      .logo { width: 55%; min-width: 150px; }
      .tagline { letter-spacing: 1.25px; font-size: 8.5px; }
      .card { padding: 22px 15px; border-radius: 22px; }
      .intro { font-size: 15px; }
      .button { min-height: 50px; font-size: 11px; }
    }

    @media (min-width: 700px) {
      body { padding: 32px; }
      .page { max-width: 460px; }
      .logo { width: 54%; max-width: 250px; }
      .card { padding: 28px 22px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <img src="Aver-logo.jpg" class="logo" alt="Aver Jewels">

    <div class="tagline">
      Tarnish-Free &nbsp;|&nbsp; Waterproof &nbsp;|&nbsp; Skin Safe
    </div>

    <section class="card">
      <p class="intro">Timeless pieces, made for every day.</p>

      <a
        class="button whatsapp"
        href="https://wa.me/918347064802?text=Hi%20Aver%20Jewels%2C%20I%27d%20like%20to%20know%20more%20about%20your%20jewellery."
        target="_blank"
        rel="noopener noreferrer"
      >
        ✦ &nbsp; SHOP ON WHATSAPP
      </a>

      <a
        class="button instagram"
        href="https://www.instagram.com/aver.jewels/"
        target="_blank"
        rel="noopener noreferrer"
      >
        FOLLOW @AVER.JEWELS
      </a>
    </section>

    <div class="footer">AVER JEWELS · EVERYDAY ELEGANCE</div>
  </main>
</body>
</html>
