<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aver Jewels — Tarnish-Free | Waterproof | Skin Safe">
  <meta name="theme-color" content="#38050e">
  <title>Aver Jewels</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:Arial,sans-serif;
      background:#38050e;
      color:#f7eee8;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px;
    }
    .page{width:100%;max-width:520px;text-align:center}
    .logo{
      display:block;
      width:min(100%,430px);
      height:auto;
      margin:0 auto 4px;
    }
    .tagline{
      font-size:11px;
      letter-spacing:2px;
      line-height:1.8;
      text-transform:uppercase;
      color:#d8bdb9;
      margin:0 auto 36px;
    }
    .card{
      background:rgba(255,248,242,.075);
      border:1px solid rgba(245,224,213,.18);
      border-radius:28px;
      padding:30px 22px;
      box-shadow:0 22px 60px rgba(0,0,0,.25);
      backdrop-filter:blur(14px);
    }
    .intro{
      font-family:Georgia,"Times New Roman",serif;
      font-size:17px;
      line-height:1.7;
      margin-bottom:24px;
      color:#f1ded8;
    }
    .button{
      display:block;
      width:100%;
      padding:17px 20px;
      margin:12px 0;
      border-radius:999px;
      text-decoration:none;
      font-size:13px;
      font-weight:700;
      letter-spacing:1.2px;
      transition:transform .2s ease,box-shadow .2s ease,background .2s ease;
    }
    .button:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.22)}
    .whatsapp{background:#f7eee8;color:#38050e}
    .instagram{background:transparent;color:#f7eee8;border:1px solid rgba(245,224,213,.38)}
    .instagram:hover{background:rgba(255,255,255,.08)}
    .footer{
      margin-top:24px;
      font-size:10px;
      letter-spacing:1.8px;
      color:#bfa3a0;
    }
    @media(max-width:480px){
      body{padding:18px}
      .card{padding:26px 18px}
      .tagline{font-size:10px}
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="Aver-logo.jpg" class="logo" alt="Aver Jewels">
    <div class="tagline">Tarnish-Free &nbsp;|&nbsp; Waterproof &nbsp;|&nbsp; Skin Safe</div>

    <section class="card">
      <p class="intro">Timeless pieces, made for every day.</p>

      <a class="button whatsapp"
         href="https://wa.me/918347064802?text=Hi%20Aver%20Jewels%2C%20I%27d%20like%20to%20know%20more%20about%20your%20jewellery."
         target="_blank" rel="noopener">
        ✦ &nbsp; SHOP ON WHATSAPP
      </a>

      <a class="button instagram"
         href="https://www.instagram.com/aver.jewels/"
         target="_blank" rel="noopener">
        FOLLOW @AVER.JEWELS
      </a>
    </section>

    <div class="footer">AVER JEWELS · EVERYDAY ELEGANCE</div>
  </main>
</body>
</html>
